description: paradistill (free-anchor, draft-prefix top-K reverse KL)
# ---------------------------------------------------------------------------
# Usage (from the repo root, in your `amlt` conda env):
#
#   amlt run amlt/amlt_paradistill.yaml <experiment_name>
#
# Override any knob at submit time, e.g.:
#   ANCHOR_SAMPLE_RATIO=0.5 amlt run amlt/amlt_paradistill.yaml paradistill_r05 --yes
#   TOPK_FKL_TEACHER_K=16 TOPK_FKL_STUDENT_K=16 amlt run amlt/amlt_paradistill.yaml paradistill_k16 --yes
#   REJECTED_DRAFT_POSITION_DECAY=0.9 amlt run amlt/amlt_paradistill.yaml paradistill_d09 --yes
# (only the knobs declared in env_defaults below are overridable -- amlt does not forward arbitrary host env.)
#
# This runs verl/examples/.../run_qwen_gsm8k_paradistill.sh (paradistill, DRAFT-PREFIX top-K reverse KL):
# free anchors (verl_dflash_response_anchor_mode) cover the response independently of reject positions.
# RESPONSE region -> top-K FORWARD KL vs the teacher at the realized prefix. REVERSE region -> sample a fresh
# draft block y_hat ~ q, run the frozen teacher ALONG it (verify-forward) to get p(.| prefix<=anchor, y_hat_<o),
# then top-K REVERSE KL between the draft head dist and that teacher dist. Both streams share a decay^(offset-1).
#
# Image / data / W&B setup is identical to amlt_draftopd.yaml — see that file's header notes #1-#3.
# ---------------------------------------------------------------------------

env_defaults:
  SLA: Premium                 # Premium for guaranteed A100-80G capacity
  NODES: 1
  GPUS: 8                       # (GPUS-TEACHER_WORLD_SIZE) student + TEACHER_WORLD_SIZE teacher, one node
  MEM: 80                       # A100-80G
  NVLINK_SUFFIX: "-NvLink"      # "-NvLink" for GPUS=8; "" for GPUS in {1,2,4}
  TEACHER_WORLD_SIZE: 1         # teacher SGLang inference-pool GPUs; the student gets the rest

  # ---- Models (HF ids, auto-cached into $HF_HOME; or blob paths) ----
  MAIN_MODEL_PATH: Qwen/Qwen3-4B
  DRAFT_MODEL_PATH: z-lab/Qwen3-4B-DFlash-b16    # warm-start; swap for your own initial draft

  # ---- Shared training knobs (read by run_qwen_gsm8k_forward-ins.sh) ----
  LR: 3e-4
  MAX_RESPONSE_LENGTH: 2048
  DISTILLATION_LOSS_MODE: k3
  train_epochs: 10
  # Auto-resume from the latest checkpoint on the blob (Standard SLA is preemptible; checkpoints persist
  # under is_output storage). disable | auto | resume_path. The frozen main_model is reloaded from HF.
  RESUME_MODE: auto

  # ---- Paradistill knobs ----
  ONPOLICY_REVERSE: True               # True = forward + draft-prefix reverse; False = FORWARD-ONLY ablation
  ANCHOR_MODE: sampled                 # stride_k | sampled
  ANCHOR_SAMPLE_RATIO: 0.2              # only used when ANCHOR_MODE=sampled
  DRAFT_SAMPLE_TEMPERATURE: 1.0         # T_draft for the fresh on-policy draft block
  # Top-K support for BOTH streams (response top-K forward KL + reverse top-K reverse KL). Both > 0 -> union
  # (S = teacher top-K_t ∪ student top-K_s); student_k > 0 is REQUIRED for topk_reverse_kl.
  TOPK_FKL_TEACHER_K: 16
  TOPK_FKL_STUDENT_K: 16
  # Per-offset decay weight decay^(offset-1) (offset = draft head depth 1..K). Applies to BOTH the response
  # (forward) and reverse streams with the SAME factor.
  REJECTED_DRAFT_POSITION_DECAY_ENABLED: True
  REJECTED_DRAFT_POSITION_DECAY: 0.8

target:
  service: sing
  name: GenAI-Shared-UKSouth2
  workspace_name: Singularity-GenAI-WS-UKSouth2
  resource_group: singularity-genai-gpu-uksouth2

code:
  local_dir: ./                 # upload the repo root (this yaml lives in amlt/); see .amltignore

storage:
  data:
    storage_account_name: vigstandard
    container_name: data
    mount_dir: /blob
    is_output: true             # persist checkpoints / wandb / hf cache back to the blob

environment:
  image: draft-opd/draft-opd:latest   # py3.12 / torch2.9.1+cu128, built from ./Dockerfile. See amlt_draftopd.yaml note #1.
  username: 44359f3e6e864ddba0853a221be97722
  registry: 44359f3e6e864ddba0853a221be97722.azurecr.io
  env:
    AMLT_DOCKERFILE_TEMPLATE: none

jobs:
  - name: paradistill_train
    sku: ${NODES}x${MEM}G${GPUS}${NVLINK_SUFFIX}
    sla_tier: ${SLA}
    priority: high
    mpi: False
    process_count_per_node: 1            # verl spawns its own single-node Ray cluster
    command:
      # Run from the uploaded code dir so relative paths (amlt/..., verl/...) resolve.
      - cd $$AMLT_CODE_DIR
      # ---- Paths rooted on the mounted blob (checkpoints / cache / logs persist) ----
      - export AZURE_STORAGE_ROOT=$${AZURE_STORAGE_ROOT:-/blob/t-xinyangliu}
      - export OUTPUT_ROOT=$${OUTPUT_ROOT:-$${AZURE_STORAGE_ROOT}/outputs/$${AMLT_JOB_NAME}/$${AMLT_EXPERIMENT_NAME}}
      - export HF_HOME=$${HF_HOME:-$${AZURE_STORAGE_ROOT}/cache/hf}
      - export CKPT_DIR=$${CKPT_DIR:-$${OUTPUT_ROOT}/checkpoints}
      - export WANDB_DIR=$${WANDB_DIR:-$${OUTPUT_ROOT}/wandb}
      # ---- W&B key (kept off the public repo; offline by default) ----
      - set +x 2>/dev/null; source $${AZURE_STORAGE_ROOT}/secret/wandb_key.sh 2>/dev/null || true
      - export PYTHONUNBUFFERED=1
      # ---- GPU split: TEACHER_WORLD_SIZE teacher GPUs, the rest for the student ----
      - export TEACHER_WORLD_SIZE=${TEACHER_WORLD_SIZE}
      - export STUDENT_WORLD_SIZE=$$(( ${GPUS} - ${TEACHER_WORLD_SIZE} ))
      # ---- Models + shared training knobs ----
      - export MAIN_MODEL_PATH="${MAIN_MODEL_PATH}"
      - export DRAFT_MODEL_PATH="${DRAFT_MODEL_PATH}"
      - export MAX_RESPONSE_LENGTH=${MAX_RESPONSE_LENGTH}
      - export LR=${LR}
      - export DISTILLATION_LOSS_MODE=${DISTILLATION_LOSS_MODE}
      - export train_epochs=${train_epochs}
      - export RESUME_MODE=${RESUME_MODE}
      - export EXP_NAME=$${AMLT_EXPERIMENT_NAME:-paradistill}
      # ---- paradistill knobs ----
      - export ONPOLICY_REVERSE=${ONPOLICY_REVERSE}
      - export ANCHOR_MODE=${ANCHOR_MODE}
      - export ANCHOR_SAMPLE_RATIO=${ANCHOR_SAMPLE_RATIO}
      - export DRAFT_SAMPLE_TEMPERATURE=${DRAFT_SAMPLE_TEMPERATURE}
      - export TOPK_FKL_TEACHER_K=${TOPK_FKL_TEACHER_K}
      - export TOPK_FKL_STUDENT_K=${TOPK_FKL_STUDENT_K}
      - export REJECTED_DRAFT_POSITION_DECAY_ENABLED=${REJECTED_DRAFT_POSITION_DECAY_ENABLED}
      - export REJECTED_DRAFT_POSITION_DECAY=${REJECTED_DRAFT_POSITION_DECAY}
      # ---- Data: train pool + val sets ship in the repo (data_prep/), uploaded with the code ----
      - export TRAIN_JSONL=$${AMLT_CODE_DIR}/data_prep/opd_pool_16k.jsonl
      - export VAL_DIR=$${VAL_DIR:-$${AMLT_CODE_DIR}/data_prep/val}
      - export VAL_FILES="['$${VAL_DIR}/aime24.jsonl','$${VAL_DIR}/gsm8k.jsonl','$${VAL_DIR}/math500.jsonl','$${VAL_DIR}/mbpp.jsonl']"
      - 'test -f "$${TRAIN_JSONL}" || { echo "[ERR] bundled pool missing (data_prep/opd_pool_16k.jsonl not uploaded?): $${TRAIN_JSONL}"; exit 1; }'
      # ---- Pre-cache HF models once (best-effort) ----
      - hf download "${MAIN_MODEL_PATH}" >/dev/null 2>&1 || true
      - hf download "${DRAFT_MODEL_PATH}" >/dev/null 2>&1 || true
      # ---- Run paradistill ----
      - bash verl/examples/on_policy_distillation_trainer/run_qwen_gsm8k_paradistill.sh "data.val_files=$${VAL_FILES}"
    submit_args:
      env:
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: True
        SHARED_MEMORY_PERCENT: 0.5
