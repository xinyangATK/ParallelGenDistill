description: Draft-OPD without sftwarmup
# ---------------------------------------------------------------------------
# Usage (from the repo root, in your `amlt` conda env):
#
#   amlt run amlt/amlt_draftopd.yaml <experiment_name>
#
# Override the SKU or any knob at submit time, e.g.:
#   SLA=Premium amlt run amlt/amlt_draftopd.yaml draftopd_premium --yes
#   LR=1e-4 MAX_RESPONSE_LENGTH=2048 amlt run amlt/amlt_draftopd.yaml draftopd_lr1e4 --yes
#   GPUS=4 NVLINK_SUFFIX="" amlt run amlt/amlt_draftopd.yaml draftopd_4gpu --yes
#
# IMPORTANT — image, data, and W&B must be set up first:
#
#  1. IMAGE: this job needs an image with the Draft-OPD stack
#     (Python 3.12 / torch 2.9.1+cu128 / sgl-kernel 0.3.21 / flashinfer 0.6.4 and a
#     CUDA runtime consistent with torch's cu128 wheels). The reference `opd-verl06`
#     image is the WRONG stack — build the image from ./Dockerfile at the repo root
#     and set `environment.image` below. The uploaded repo's editable installs
#     (sglang-dflash + verl) are re-applied at runtime so the code matches this checkout.
#
#  2. DATA: both the prebuilt 16K train pool (data_prep/opd_pool_16k.jsonl, ~27MB) and
#     the 4 val sets (data_prep/val/, ~1MB) ship in the repo and upload with the code,
#     so the job needs NO blob build and NO HF data download. TRAIN_JSONL / VAL_DIR
#     default to $AMLT_CODE_DIR/data_prep/... To regenerate the pool, run
#     data_prep/prepare_opd_pool.py locally and re-commit it.
#     Models (Qwen/Qwen3-4B, z-lab/Qwen3-4B-DFlash-b16) are pulled from HF into
#     $HF_HOME on the blob (cached across runs).
#
#  3. W&B: the inner script forces WANDB_MODE=offline, so runs log to $WANDB_DIR on
#     the blob (sync later with `wandb sync <run-dir>`). To also have the key
#     available (e.g. if you flip to online), upload it to <blob>/secret/wandb_key.sh
#     — see amlt/wandb_key.sh.example. The key is NEVER committed to this repo.
# ---------------------------------------------------------------------------

env_defaults:
  SLA: Premium                 # Premium for guaranteed A100-80G capacity
  NODES: 1
  GPUS: 8                       # (GPUS-TEACHER_WORLD_SIZE) student + TEACHER_WORLD_SIZE teacher, one node
  MEM: 80                       # A100-80G
  NVLINK_SUFFIX: "-NvLink"      # "-NvLink" for GPUS=8; "" for GPUS in {1,2,4}
  TEACHER_WORLD_SIZE: 1         # teacher SGLang inference-pool GPUs; the student gets the rest

  # ---- Models (HF ids, auto-cached into $HF_HOME; or blob paths) ----
  MAIN_MODEL_PATH: Qwen/Qwen3-4B
  DRAFT_MODEL_PATH: z-lab/Qwen3-4B-DFlash-b16    # warm-start; swap for your own initial draft

  # ---- Data: train pool is BUILT on the blob by data_prep at job time (reused if
  #      present); the 4 val sets ship in the repo (data_prep/val/) and upload with
  #      the code, so they are ready before the first run. ----

  # ---- Training knobs (read by run_qwen_gsm8k_forward-ins.sh) ----
  LR: 3e-4
  MAX_RESPONSE_LENGTH: 2048
  DISTILLATION_LOSS_MODE: k3
  FORWARD_KL_WEIGHT: 1.0
  REVERSE_KL_WEIGHT: 0.0
  # Auto-resume from the latest checkpoint (disable | auto | resume_path). Safe on a fresh run.
  # Re-submitting the SAME experiment name continues from the last global_step_* (hydrated blob->local
  # below); the frozen main_model is rebuilt from HF. Set RESUME_MODE=disable to force from-scratch.
  RESUME_MODE: auto
  # ---- Checkpoint storage: the trainer writes to node-local FAST disk (LOCAL_CKPT_ROOT) and a background
  #      loop mirrors to the durable blob copy. Saving FSDP shards straight to blob-fuse is slow and the
  #      post-save distributed barrier (nccl_timeout) can crash the job. See docs/checkpoint_local_to_blob.md.
  LOCAL_CKPT_ROOT: /scratch    # node-local fast disk root (override per cluster; LOCAL_CKPT = $ROOT/draftopd_ckpt/$EXP)
  CKPT_MIRROR_INTERVAL: 300    # seconds between local->blob mirror passes
  MAX_LOCAL_CKPT_KEEP: 2       # keep last N checkpoints on LOCAL disk (blob keeps the full history)
  # True (default) = original draftopd (reverse KL on the rejected draft token). Set False for a
  # FORWARD-ONLY draftopd: skip the reverse stream in the model (no reverse softmax / OOM), train only
  # the response forward KL. Override at submit: REJECTED_DRAFT_REVERSE=False amlt run ... --yes
  REJECTED_DRAFT_REVERSE: True
  # ---- Per-region loss selection. Response stream: RESPONSE_LOSS_MODE (accepted tokens) +
  #      REJECT_ACCEPT_LOSS_MODE (corrected token y) in {bernoulli_fkl, topk_fkl, topk_tv}. Reject stream:
  #      REJECT_TOKEN_LOSS_MODE (first mismatch d) + POST_REJECT_LOSS_MODE (discarded suffix) in
  #      {reverse_kl, topk_fkl, topk_reverse_kl}. Defaults below reproduce original draftopd. Top-K losses are
  #      in-model over teacher/student top-K; TOPK_FKL_TEACHER_K & TOPK_FKL_STUDENT_K both > 0 -> union.
  #      topk_reverse_kl at a reject position covers both y and d (set response_stream_weight=0 -> reject only). ----
  RESPONSE_LOSS_MODE: bernoulli_fkl
  REJECT_ACCEPT_LOSS_MODE: bernoulli_fkl
  REJECT_TOKEN_LOSS_MODE: reverse_kl
  POST_REJECT_LOSS_MODE: reverse_kl
  TOPK_FKL_TEACHER_K: 16        # teacher-side top-K (0 disables the teacher support)
  TOPK_FKL_STUDENT_K: 16         # student-side top-K (0 disables; both > 0 -> union). REQUIRED > 0 for topk_reverse_kl.
  RESPONSE_STREAM_WEIGHT: 1.0   # response-stream weight; set 0 to train ONLY reject positions
  # Reject side = two INDEPENDENT streams. REVERSE_STREAM_WEIGHT weights the reverse (reject-token, first
  # mismatch d) stream; POST_REJECT_STREAM_WEIGHT weights the post-reject (discarded suffix / deep-head) stream.
  # POST_REJECT_STREAM_WEIGHT=-1 (default) inherits the reverse weight -> one shared stream (original behavior).
  # Score each block position ONCE under top-K: REVERSE_STREAM_WEIGHT=0 + POST_REJECT_STREAM_WEIGHT=1 (keep
  # REJECTED_DRAFT_REVERSE=True so the reject stream is still collected).
  REVERSE_STREAM_WEIGHT: 1.0
  POST_REJECT_STREAM_WEIGHT: -1.0
  # Reject-stream per-offset weighting: weight each rejected/FKL slot by DECAY^(offset-1) (offset = draft
  # head depth). Applies to BOTH the baseline reverse stream and the Request 2 top-K FKL. ENABLED=False ->
  # uniform weights. Matches the launcher defaults (True / 0.8); set here to make them tunable at submit.
  REJECTED_DRAFT_POSITION_DECAY_ENABLED: True
  REJECTED_DRAFT_POSITION_DECAY: 0.8
  train_epochs: 8

target:
  service: sing
  name: GenAI-Shared-UKSouth2
  workspace_name: Singularity-GenAI-WS-UKSouth2
  resource_group: singularity-genai-gpu-uksouth2

code:
  local_dir: ./                 # upload the repo root (this yaml lives in amlt/); see .amltignore

storage:
  data:
    storage_account_name: vigstandard
    container_name: data
    mount_dir: /blob
    is_output: true             # persist checkpoints / wandb / hf cache back to the blob

environment:
  image: draft-opd/draft-opd:latest   # py3.12 / torch2.9.1+cu128, built from ./Dockerfile. See header note #1.
  username: 44359f3e6e864ddba0853a221be97722
  registry: 44359f3e6e864ddba0853a221be97722.azurecr.io
  env:
    AMLT_DOCKERFILE_TEMPLATE: none

jobs:
  - name: draftopd_dflash_opd
    sku: ${NODES}x${MEM}G${GPUS}${NVLINK_SUFFIX}
    sla_tier: ${SLA}
    priority: high
    mpi: False
    process_count_per_node: 1            # verl spawns its own single-node Ray cluster
    command:
      # Run from the uploaded code dir so relative paths (amlt/..., verl/...) resolve.
      - cd $$AMLT_CODE_DIR
      # ---- Paths rooted on the mounted blob (checkpoints / cache / logs persist) ----
      - export AZURE_STORAGE_ROOT=$${AZURE_STORAGE_ROOT:-/blob/t-xinyangliu}
      - export OUTPUT_ROOT=$${OUTPUT_ROOT:-$${AZURE_STORAGE_ROOT}/outputs/$${AMLT_JOB_NAME}/$${AMLT_EXPERIMENT_NAME}}
      - export HF_HOME=$${HF_HOME:-$${AZURE_STORAGE_ROOT}/cache/hf}
      # ---- Checkpoints: trainer writes to node-local fast disk (LOCAL_CKPT = CKPT_DIR =
      #      trainer.default_local_dir); a background loop (below) mirrors to the durable blob copy
      #      (BLOB_CKPT). See docs/checkpoint_local_to_blob.md. ----
      - export BLOB_CKPT=$${BLOB_CKPT:-$${OUTPUT_ROOT}/checkpoints}
      - export LOCAL_CKPT=$${LOCAL_CKPT:-${LOCAL_CKPT_ROOT}/draftopd_ckpt/$${AMLT_EXPERIMENT_NAME:-draftopd}}
      - export CKPT_DIR=$${LOCAL_CKPT}
      # Create + fail-fast-verify LOCAL_CKPT is writable (LOCAL_CKPT_ROOT must be node-local disk with space),
      # and log the path + mount so run 1 reveals whether /tmp is a real disk vs a small tmpfs.
      - 'mkdir -p "$${LOCAL_CKPT}" && touch "$${LOCAL_CKPT}/.wtest" 2>/dev/null && rm -f "$${LOCAL_CKPT}/.wtest" || { echo "[ERR] LOCAL_CKPT not writable: $${LOCAL_CKPT} -- set LOCAL_CKPT_ROOT to a node-local fast disk"; exit 1; }; echo "[ckpt] LOCAL_CKPT=$${LOCAL_CKPT}  BLOB_CKPT=$${BLOB_CKPT}"; df -h "$${LOCAL_CKPT}" | tail -1'
      - export WANDB_DIR=$${WANDB_DIR:-$${OUTPUT_ROOT}/wandb}
      # ---- W&B key (kept off the public repo; offline by default — see header note #3) ----
      - set +x 2>/dev/null; source $${AZURE_STORAGE_ROOT}/secret/wandb_key.sh 2>/dev/null || true
      # ---- No runtime editable reinstall (like opd_verl06): the image's /opt/venv is not
      #      writable for the job user. The entrypoint cd's to verl/ and runs `python -m verl...`,
      #      so the UPLOADED verl wins via cwd; sglang uses the image's baked editable install
      #      (correct as long as sglang-dflash source is unchanged since the image build). ----
      - export PYTHONUNBUFFERED=1
      # ---- GPU split: TEACHER_WORLD_SIZE teacher GPUs, the rest for the student ----
      - export TEACHER_WORLD_SIZE=${TEACHER_WORLD_SIZE}
      - export STUDENT_WORLD_SIZE=$$(( ${GPUS} - ${TEACHER_WORLD_SIZE} ))
      # ---- Models + training knobs the entrypoint reads from the environment ----
      - export MAIN_MODEL_PATH="${MAIN_MODEL_PATH}"
      - export DRAFT_MODEL_PATH="${DRAFT_MODEL_PATH}"
      - export MAX_RESPONSE_LENGTH=${MAX_RESPONSE_LENGTH}
      - export LR=${LR}
      - export DISTILLATION_LOSS_MODE=${DISTILLATION_LOSS_MODE}
      - export FORWARD_KL_WEIGHT=${FORWARD_KL_WEIGHT}
      - export REVERSE_KL_WEIGHT=${REVERSE_KL_WEIGHT}
      - export RESUME_MODE=${RESUME_MODE}
      - export REJECTED_DRAFT_REVERSE=${REJECTED_DRAFT_REVERSE}
      - export RESPONSE_LOSS_MODE=${RESPONSE_LOSS_MODE}
      - export REJECT_ACCEPT_LOSS_MODE=${REJECT_ACCEPT_LOSS_MODE}
      - export REJECT_TOKEN_LOSS_MODE=${REJECT_TOKEN_LOSS_MODE}
      - export POST_REJECT_LOSS_MODE=${POST_REJECT_LOSS_MODE}
      - export TOPK_FKL_TEACHER_K=${TOPK_FKL_TEACHER_K}
      - export TOPK_FKL_STUDENT_K=${TOPK_FKL_STUDENT_K}
      - export stream_weight=${RESPONSE_STREAM_WEIGHT}
      - export REVERSE_STREAM_WEIGHT=${REVERSE_STREAM_WEIGHT}
      - export POST_REJECT_STREAM_WEIGHT=${POST_REJECT_STREAM_WEIGHT}
      - export REJECTED_DRAFT_POSITION_DECAY_ENABLED=${REJECTED_DRAFT_POSITION_DECAY_ENABLED}
      - export REJECTED_DRAFT_POSITION_DECAY=${REJECTED_DRAFT_POSITION_DECAY}
      - export train_epochs=${train_epochs}
      - export EXP_NAME=$${AMLT_EXPERIMENT_NAME:-draftopd}
      # ---- OPD train pool: prebuilt and BUNDLED in the repo (data_prep/), uploaded with
      #      the code like the val sets — no blob build / no HF data download at job time. ----
      - export TRAIN_JSONL=$${AMLT_CODE_DIR}/data_prep/opd_pool_16k.jsonl
      # val sets ship in the repo (data_prep/val/), uploaded with the code -> ready on run 1
      - export VAL_DIR=$${VAL_DIR:-$${AMLT_CODE_DIR}/data_prep/val}
      - export VAL_FILES="['$${VAL_DIR}/aime24.jsonl','$${VAL_DIR}/gsm8k.jsonl','$${VAL_DIR}/math500.jsonl','$${VAL_DIR}/mbpp.jsonl']"
      - 'test -f "$${TRAIN_JSONL}" || { echo "[ERR] bundled pool missing (data_prep/opd_pool_16k.jsonl not uploaded?): $${TRAIN_JSONL}"; exit 1; }'
      # ---- Pre-cache HF models with RETRIES (a transient HF blip during SGLang's on-demand draft download
      #      crashes the scheduler; the old best-effort '|| true' silently hid a partial download, leaving an
      #      incomplete blob HF_HOME snapshot that SGLang re-fetches). Once the cache is fully populated the
      #      load hits the local snapshot first (no network); HF still downloads on a genuine cache miss. ----
      - 'for m in "$${MAIN_MODEL_PATH}" "$${DRAFT_MODEL_PATH}"; do for i in 1 2 3 4 5 6; do hf download "$$m" >/dev/null 2>&1 && break; echo "[hf] download retry $$i/6 for $$m"; sleep $$(( i * 20 )); done; done'
      # ---- Hydrate: pull ONLY the latest blob checkpoint back to local so RESUME_MODE=auto resumes
      #      (the trainer only looks at LOCAL_CKPT; local is empty on a fresh node). ----
      - 'mkdir -p "$${LOCAL_CKPT}" "$${BLOB_CKPT}"; if [ -f "$${BLOB_CKPT}/latest_checkpointed_iteration.txt" ]; then s=$$(cat "$${BLOB_CKPT}/latest_checkpointed_iteration.txt"); echo "[ckpt] hydrate global_step_$${s} blob->local"; cp -r "$${BLOB_CKPT}/global_step_$${s}" "$${LOCAL_CKPT}/" 2>/dev/null || true; cp "$${BLOB_CKPT}/latest_checkpointed_iteration.txt" "$${LOCAL_CKPT}/" 2>/dev/null || true; fi'
      # ---- Run with a background local->blob mirror, then stop it + final-flush, preserving the TRAINING
      #      exit code. sync_blob is additive (never --delete) and copies global_step_* BEFORE the tracker so
      #      blob's tracker never points at a half-copied checkpoint; '|| true' keeps the loop alive through
      #      transient copy errors / checkpoint rotation. Mirror + train + flush are ONE shell item so the
      #      background PID lifecycle is self-contained. ----
      - 'sync_blob() { cp -ru "$${LOCAL_CKPT}"/global_step_* "$${BLOB_CKPT}/" 2>/dev/null || true; cp -u "$${LOCAL_CKPT}"/latest_checkpointed_iteration.txt "$${BLOB_CKPT}/" 2>/dev/null || true; }; set -m; ( while true; do sync_blob; sleep ${CKPT_MIRROR_INTERVAL}; done ) & CKPT_SYNC_PID=$$!; set +m; if bash verl/examples/on_policy_distillation_trainer/run_qwen_gsm8k_forward-ins.sh "data.val_files=$${VAL_FILES}" "trainer.max_actor_ckpt_to_keep=${MAX_LOCAL_CKPT_KEEP}"; then rc=0; else rc=$$?; fi; kill -- -$${CKPT_SYNC_PID} 2>/dev/null || true; sync_blob; exit $${rc}'
    submit_args:
      env:
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: True
        SHARED_MEMORY_PERCENT: 0.5
