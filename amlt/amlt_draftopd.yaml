description: Draft-OPD without sftwarmup
# ---------------------------------------------------------------------------
# Usage (from the repo root, in your `amlt` conda env):
#
#   amlt run amlt/amlt_draftopd.yaml <experiment_name>
#
# Override the SKU or any knob at submit time, e.g.:
#   SLA=Premium amlt run amlt/amlt_draftopd.yaml draftopd_premium --yes
#   LR=1e-4 MAX_RESPONSE_LENGTH=2048 amlt run amlt/amlt_draftopd.yaml draftopd_lr1e4 --yes
#   GPUS=4 NVLINK_SUFFIX="" amlt run amlt/amlt_draftopd.yaml draftopd_4gpu --yes
#
# IMPORTANT — image, data, and W&B must be set up first:
#
#  1. IMAGE: this job needs an image with the Draft-OPD stack
#     (Python 3.12 / torch 2.9.1+cu128 / sgl-kernel 0.3.21 / flashinfer 0.6.4 and a
#     CUDA runtime consistent with torch's cu128 wheels). The reference `opd-verl06`
#     image is the WRONG stack — build the image from ./Dockerfile at the repo root
#     and set `environment.image` below. The uploaded repo's editable installs
#     (sglang-dflash + verl) are re-applied at runtime so the code matches this checkout.
#
#  2. DATA: both the prebuilt 16K train pool (data_prep/opd_pool_16k.jsonl, ~27MB) and
#     the 4 val sets (data_prep/val/, ~1MB) ship in the repo and upload with the code,
#     so the job needs NO blob build and NO HF data download. TRAIN_JSONL / VAL_DIR
#     default to $AMLT_CODE_DIR/data_prep/... To regenerate the pool, run
#     data_prep/prepare_opd_pool.py locally and re-commit it.
#     Models (Qwen/Qwen3-4B, z-lab/Qwen3-4B-DFlash-b16) are pulled from HF into
#     $HF_HOME on the blob (cached across runs).
#
#  3. W&B: the inner script forces WANDB_MODE=offline, so runs log to $WANDB_DIR on
#     the blob (sync later with `wandb sync <run-dir>`). To also have the key
#     available (e.g. if you flip to online), upload it to <blob>/secret/wandb_key.sh
#     — see amlt/wandb_key.sh.example. The key is NEVER committed to this repo.
# ---------------------------------------------------------------------------

env_defaults:
  SLA: Premium                 # Premium for guaranteed A100-80G capacity
  NODES: 1
  GPUS: 8                       # (GPUS-TEACHER_WORLD_SIZE) student + TEACHER_WORLD_SIZE teacher, one node
  MEM: 80                       # A100-80G
  NVLINK_SUFFIX: "-NvLink"      # "-NvLink" for GPUS=8; "" for GPUS in {1,2,4}
  TEACHER_WORLD_SIZE: 1         # teacher SGLang inference-pool GPUs; the student gets the rest

  # ---- Models (HF ids, auto-cached into $HF_HOME; or blob paths) ----
  MAIN_MODEL_PATH: Qwen/Qwen3-4B
  DRAFT_MODEL_PATH: z-lab/Qwen3-4B-DFlash-b16    # warm-start; swap for your own initial draft

  # ---- Data: train pool is BUILT on the blob by data_prep at job time (reused if
  #      present); the 4 val sets ship in the repo (data_prep/val/) and upload with
  #      the code, so they are ready before the first run. ----

  # ---- Training knobs (read by run_qwen_gsm8k_forward-ins.sh) ----
  LR: 3e-4
  MAX_RESPONSE_LENGTH: 2048
  DISTILLATION_LOSS_MODE: k3
  FORWARD_KL_WEIGHT: 1.0
  REVERSE_KL_WEIGHT: 0.0
  # True (default) = original draftopd (reverse KL on the rejected draft token). Set False for a
  # FORWARD-ONLY draftopd: skip the reverse stream in the model (no reverse softmax / OOM), train only
  # the response forward KL. Override at submit: REJECTED_DRAFT_REVERSE=False amlt run ... --yes
  REJECTED_DRAFT_REVERSE: True
  # ---- Top-K forward KL (in-model, from the frozen teacher's full logits). Default off = original
  #      draftopd. TOPK_FKL_RESPONSE=True -> response forward term is a top-K forward KL (request 1).
  #      TOPK_FKL_REJECT=True -> reject stream uses the SAME rollout-reject slots as baseline but a top-K
  #      forward KL vs the teacher's realized-position top-K (teacher forcing), instead of reverse KL on
  #      the rejected token's cached scalar (request 2; keeps offset decay). TOPK_FKL_MODE=teacher|student|union. ----
  TOPK_FKL_RESPONSE: False
  TOPK_FKL_REJECT: False
  TOPK_FKL_MODE: teacher
  TOPK_FKL_K: 64
  train_epochs: 8

target:
  service: sing
  name: GenAI-Shared-UKSouth2
  workspace_name: Singularity-GenAI-WS-UKSouth2
  resource_group: singularity-genai-gpu-uksouth2

code:
  local_dir: ./                 # upload the repo root (this yaml lives in amlt/); see .amltignore

storage:
  data:
    storage_account_name: vigstandard
    container_name: data
    mount_dir: /blob
    is_output: true             # persist checkpoints / wandb / hf cache back to the blob

environment:
  image: draft-opd/draft-opd:latest   # py3.12 / torch2.9.1+cu128, built from ./Dockerfile. See header note #1.
  username: 44359f3e6e864ddba0853a221be97722
  registry: 44359f3e6e864ddba0853a221be97722.azurecr.io
  env:
    AMLT_DOCKERFILE_TEMPLATE: none

jobs:
  - name: draftopd_dflash_opd
    sku: ${NODES}x${MEM}G${GPUS}${NVLINK_SUFFIX}
    sla_tier: ${SLA}
    priority: high
    mpi: False
    process_count_per_node: 1            # verl spawns its own single-node Ray cluster
    command:
      # Run from the uploaded code dir so relative paths (amlt/..., verl/...) resolve.
      - cd $$AMLT_CODE_DIR
      # ---- Paths rooted on the mounted blob (checkpoints / cache / logs persist) ----
      - export AZURE_STORAGE_ROOT=$${AZURE_STORAGE_ROOT:-/blob/t-xinyangliu}
      - export OUTPUT_ROOT=$${OUTPUT_ROOT:-$${AZURE_STORAGE_ROOT}/outputs/$${AMLT_JOB_NAME}/$${AMLT_EXPERIMENT_NAME}}
      - export HF_HOME=$${HF_HOME:-$${AZURE_STORAGE_ROOT}/cache/hf}
      - export CKPT_DIR=$${CKPT_DIR:-$${OUTPUT_ROOT}/checkpoints}
      - export WANDB_DIR=$${WANDB_DIR:-$${OUTPUT_ROOT}/wandb}
      # ---- W&B key (kept off the public repo; offline by default — see header note #3) ----
      - set +x 2>/dev/null; source $${AZURE_STORAGE_ROOT}/secret/wandb_key.sh 2>/dev/null || true
      # ---- No runtime editable reinstall (like opd_verl06): the image's /opt/venv is not
      #      writable for the job user. The entrypoint cd's to verl/ and runs `python -m verl...`,
      #      so the UPLOADED verl wins via cwd; sglang uses the image's baked editable install
      #      (correct as long as sglang-dflash source is unchanged since the image build). ----
      - export PYTHONUNBUFFERED=1
      # ---- GPU split: TEACHER_WORLD_SIZE teacher GPUs, the rest for the student ----
      - export TEACHER_WORLD_SIZE=${TEACHER_WORLD_SIZE}
      - export STUDENT_WORLD_SIZE=$$(( ${GPUS} - ${TEACHER_WORLD_SIZE} ))
      # ---- Models + training knobs the entrypoint reads from the environment ----
      - export MAIN_MODEL_PATH="${MAIN_MODEL_PATH}"
      - export DRAFT_MODEL_PATH="${DRAFT_MODEL_PATH}"
      - export MAX_RESPONSE_LENGTH=${MAX_RESPONSE_LENGTH}
      - export LR=${LR}
      - export DISTILLATION_LOSS_MODE=${DISTILLATION_LOSS_MODE}
      - export FORWARD_KL_WEIGHT=${FORWARD_KL_WEIGHT}
      - export REVERSE_KL_WEIGHT=${REVERSE_KL_WEIGHT}
      - export REJECTED_DRAFT_REVERSE=${REJECTED_DRAFT_REVERSE}
      - export TOPK_FKL_RESPONSE=${TOPK_FKL_RESPONSE}
      - export TOPK_FKL_REJECT=${TOPK_FKL_REJECT}
      - export TOPK_FKL_MODE=${TOPK_FKL_MODE}
      - export TOPK_FKL_K=${TOPK_FKL_K}
      - export train_epochs=${train_epochs}
      - export EXP_NAME=$${AMLT_EXPERIMENT_NAME:-draftopd}
      # ---- OPD train pool: prebuilt and BUNDLED in the repo (data_prep/), uploaded with
      #      the code like the val sets — no blob build / no HF data download at job time. ----
      - export TRAIN_JSONL=$${AMLT_CODE_DIR}/data_prep/opd_pool_16k.jsonl
      # val sets ship in the repo (data_prep/val/), uploaded with the code -> ready on run 1
      - export VAL_DIR=$${VAL_DIR:-$${AMLT_CODE_DIR}/data_prep/val}
      - export VAL_FILES="['$${VAL_DIR}/aime24.jsonl','$${VAL_DIR}/gsm8k.jsonl','$${VAL_DIR}/math500.jsonl','$${VAL_DIR}/mbpp.jsonl']"
      - 'test -f "$${TRAIN_JSONL}" || { echo "[ERR] bundled pool missing (data_prep/opd_pool_16k.jsonl not uploaded?): $${TRAIN_JSONL}"; exit 1; }'
      # ---- Pre-cache HF models once (best-effort; trainer downloads on demand otherwise) ----
      - hf download "${MAIN_MODEL_PATH}" >/dev/null 2>&1 || true
      - hf download "${DRAFT_MODEL_PATH}" >/dev/null 2>&1 || true
      # ---- Run ----
      - bash verl/examples/on_policy_distillation_trainer/run_qwen_gsm8k_forward-ins.sh "data.val_files=$${VAL_FILES}"
    submit_args:
      env:
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: True
        SHARED_MEMORY_PERCENT: 0.5
